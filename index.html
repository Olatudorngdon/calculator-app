<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Web Page</title>
    <link rel="stylesheet" href="style.css">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <script src="https://kit.fontawesome.com/26b0ef479b.js" crossorigin="anonymous"></script>
    <link href="https://fonts.googleapis.com/css2?family=Work+Sans:ital,wght@0,100..900;1,100..900&display=swap" rel="stylesheet">
    <body>

       

     
        <main class="calculator">
            <container class="bg-size">
            <div class="calculator-bg">
                <div class="headline">
                    <span>[olacalc]</span>
                    <p>A simple calculator app for simple <br>mathematical equations</p>
                   
                </div>
                    <div>
                        <input type="text" id="display" class="display" >
                    </div>
                    <hr style="border: 0.5px solid #373737; margin: 20px 0; border-radius: 10px;">

                 <div class="buttons">
                    <button class="btn" data-value="7">7</button>
                    <button class="btn" data-value="8">8</button>
                    <button class="btn" data-value="9">9</button>
                    <button class="btn" data-value="/" id="operator">/</button>
                    <button class="btn" data-value="4">4</button>
                    <button class="btn" data-value="5">5</button>
                    <button class="btn" data-value="6">6</button>
                    <button class="btn" data-value="*"  id="operator">*</button>
                    <button class="btn" data-value="1">1</button>
                    <button class="btn" data-value="2">2</button>
                    <button class="btn" data-value="3">3</button>
                    <button class="btn" data-value="-"  id="operator">-</button>
                    <button  data-value="=" id="equal">=</button>
                    <button class="btn" data-value="0">0</button>
                   
                    <button class="btn" data-value="C"  id="clear">C</button>
                    <button class="btn" data-value="+"  id="operator">+</button>
                 </div>
                 <hr style="border: 0.5px solid #373737; margin: 20px 0; border-radius: 10px;">
                 <p class="credit">Created with <i class="fa-solid fa-heart" style="color: #C0FFFB;"></i> by <span style="color: #BFBDC1;">Oladimeji Gabriel</span></p>
                </div>
            </container>
        </main>
        <script src="script.js"></script>
    </body>
</html>
